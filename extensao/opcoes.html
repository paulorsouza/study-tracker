<meta charset="utf-8">
<title>Estudos — pareamento</title>
<style>
  body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; max-width: 460px;
         margin: 32px auto; padding: 0 16px; color: #1c1c1f; }
  h1 { font-size: 17px; }
  p { color: #55555f; }
  input { width: 100%; padding: 9px 11px; border: 1px solid #ccd; border-radius: 7px;
          font: inherit; margin: 6px 0 14px; }
  button { padding: 9px 16px; border: 0; border-radius: 7px; background: #3b5bdb;
           color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 12px; font-weight: 600; }
</style>
<h1>Parear com o app</h1>
<p>
  No app Estudos, seção <b>Extensão do Chrome</b>, copie o token e cole aqui.
  Ele fica só neste navegador e autoriza esta extensão a falar com o app na
  sua máquina.
</p>
<label for="token">Token</label>
<input id="token" type="password" autocomplete="off" spellcheck="false">
<label for="porta">Porta</label>
<input id="porta" type="number" value="47823">
<button id="salvar">Salvar e testar</button>
<div id="msg"></div>
<script src="opcoes.js"></script>
